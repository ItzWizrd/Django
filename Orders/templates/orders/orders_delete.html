{% extends 'home/base.html' %}

{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<div class="container mt-4">
    <div class="orders-card card border-0 shadow-sm mx-auto" style="max-width: 560px;">
        <div class="card-header orders-header text-center">
            <i class="bi bi-exclamation-triangle display-5 mb-2 d-block"></i>
            <h3 class="mb-0">Delete Order</h3>
        </div>

        <div class="card-body p-4 text-center">
            <p class="mb-1">Are you sure you want to delete</p>
            <p class="fs-5 fw-semibold mb-3">Order #{{ order.order_id }} &mdash; {{ order.customer.name }}</p>
            <p class="text-muted mb-4">This action cannot be undone.</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash3 me-1"></i>Delete
                    </button>
                    <a href="{% url 'order_list' %}" class="btn btn-outline-secondary px-4">
                        <i class="bi bi-x-lg me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .orders-card {
        border-radius: 14px;
        overflow: hidden;
    }

    .orders-header {
        background: linear-gradient(135deg, #dc3545, #a71d2a);
        color: #fff;
        padding: 1.5rem;
    }

    .btn-danger {
        border-radius: 8px;
        font-weight: 600;
    }

    .btn-outline-secondary {
        border-radius: 8px;
    }
</style>
{% endblock %}
