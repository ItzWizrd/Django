{% extends "home/base.html" %}

{% block content %}
<style>
    .content { background: #f4f7fb; }
    .card { border: 0; border-top: 4px solid #dc3545; border-radius: 14px; }
    .card h2 { color: #b42318; }
    .card p { margin: 20px 0 24px; color: #475467; }
    .btn { border-radius: 8px; font-weight: 600; }
</style>
<div class="card shadow-sm mx-auto" style="max-width: 600px;"><div class="card-body p-4">
    <h2>Delete Order</h2><p>Are you sure you want to delete <strong>{{ object }}</strong>?</p>
    <form method="post">{% csrf_token %}<button class="btn btn-danger" type="submit">Yes, Delete</button> <a class="btn btn-outline-secondary" href="{% url 'order:order-list' %}">Cancel</a></form>
</div></div>
{% endblock %}
