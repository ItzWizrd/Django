{% if is_paginated %}
<nav class="mt-4" aria-label="List pages">
    <ul class="pagination justify-content-center mb-0">
        <li class="page-item{% if not page_obj.has_previous %} disabled{% endif %}">
            {% if page_obj.has_previous %}
                <a class="page-link" href="?page={{ page_obj.previous_page_number }}" aria-label="Previous page">Previous</a>
            {% else %}
                <span class="page-link">Previous</span>
            {% endif %}
        </li>

        {% for page_number in paginator.page_range %}
        <li class="page-item{% if page_number == page_obj.number %} active{% endif %}">
            <a class="page-link" href="?page={{ page_number }}"{% if page_number == page_obj.number %} aria-current="page"{% endif %}>{{ page_number }}</a>
        </li>
        {% endfor %}

        <li class="page-item{% if not page_obj.has_next %} disabled{% endif %}">
            {% if page_obj.has_next %}
                <a class="page-link" href="?page={{ page_obj.next_page_number }}" aria-label="Next page">Next</a>
            {% else %}
                <span class="page-link">Next</span>
            {% endif %}
        </li>
    </ul>
</nav>
{% endif %}
